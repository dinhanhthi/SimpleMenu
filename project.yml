name: "SimpleMenu"
options:
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # KeyboardShortcuts 3.1.0, pinned by commit (git ls-remote ... refs/tags/3.1.0^{}; annotated tag, peeled).
    revision: 772133d9dbe800fdac0473226822994c5c162c58
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Ad-hoc default; the app target overrides it with Developer ID. scripts/build-and-notarize.sh signs releases itself.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "86H6CNLN4C"
targets:
  "SimpleMenu":
    type: application
    platform: macOS
    sources:
      - path: App
      - path: assets/logo_bg.icon
      # About and toolbar logo, exported from logo_bg.icon.
      - path: assets/logo_bg.png
        buildPhase: resources
      # Menu bar icon: gray on a light menu bar, white on a dark one.
      - path: assets/logo_object_gray.png
        buildPhase: resources
      - path: assets/logo_object_white.png
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.math2it.simplemenu"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_CFBundleDisplayName: "SimpleMenu"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: logo_bg
        INFOPLIST_KEY_LSUIElement: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/SimpleMenu-Bridging-Header.h
        # Debug is Developer ID-signed so the Accessibility grant survives rebuilds
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
    scheme:
      testTargets:
        - SimpleMenuTests
  # Hostless: Layout.swift and PromptSanitizer.swift are compiled in directly, so `xcodebuild test` never launches SimpleMenu
  # or restricts the real menu bar. No TEST_HOST and no dependency on the app (XcodeGen would infer a host).
  "SimpleMenuTests":
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SimpleMenuTests
      - path: App/Engine/Layout.swift
      - path: App/AI/PromptSanitizer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.math2it.simplemenu.tests"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
